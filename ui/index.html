<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>bekky</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Vai al contenuto</a>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6v5.5c0 4.2 2.8 7.4 7 9 4.2-1.6 7-4.8 7-9V6z"/><path d="m8.8 12 2.4 2.4 4-4.6"/></svg>
      </span>
      <span class="wordmark">bekky</span>
      <span class="pc-mobile" id="pc-mobile"></span>
    </div>
    <nav class="nav" id="nav" aria-label="Sezioni"></nav>
    <div class="pc">
      <span class="pc-label">Questo PC</span>
      <span class="pc-name" id="pc-name"></span>
    </div>
  </div>

  <main id="main" class="main" tabindex="-1">
    <div class="content">
      <header class="page-head">
        <h1 id="view-title" tabindex="-1">bekky</h1>
        <p class="lead" id="view-sub"></p>
      </header>
      <div class="banner" id="errbar" role="alert" hidden>
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 19.5h18z"/><path d="M12 10v4.5"/><path d="M12 17.2v.1"/></svg>
        <span id="errtext"></span>
        <button type="button" class="btn sm" id="errretry">Riprova</button>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<dialog id="dlg" class="dlg" aria-labelledby="dlg-title" aria-modal="true">
  <h2 id="dlg-title"></h2>
  <div id="dlg-body" class="dlg-body"></div>
  <div class="dlg-actions" id="dlg-actions"></div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript><p class="noscript">Per usare bekky serve JavaScript attivo nel browser.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
